<body><div class="wrap">
<header class="top"><div><div class="brand">🚀 星球学习大冒险</div><div class="sub">每天进步一点点，你就是自己的小英雄！</div></div><button id="soundBtn" aria-label="音效开关">🔊 音效</button></header>

</main></div><div id="toast" class="toast hidden"></div>

['语文',1,'字词','“绒球花”的“绒”读音是？',['róng','yóng','rǒng'],0,'“绒”读 róng，注意声母是 r。'],['语文',1,'字词','“早晨”的近义词是？',['清晨','夜晚','中午'],0,'早晨和清晨都表示天刚亮后的一段时间。'],['语文',2,'字词','“秋高气爽”适合描写哪个季节？',['春天','秋天','冬天'],1,'“秋高气爽”是描写秋天天空高远、天气凉爽的词语。'],['语文',2,'日记','日记开头通常要写日期、星期和什么？',['天气','姓名','学校'],0,'日记常在第一行写日期、星期和天气。'],['语文',3,'童话理解','童话中的人物可以是会说话的动物。',['正确','错误'],0,'拟人化的动物、植物或物品是童话常见角色。'],['语文',3,'童话理解','《卖火柴的小女孩》中的小女孩最后过上了幸福生活。',['正确','错误'],1,'故事结尾小女孩在寒冷中去世，表达了对她的同情。'],['语文',4,'预测','预测故事时，只能看题目，不能联系插图。',['正确','错误'],1,'题目、插图、已有内容和生活经验都能帮助预测。'],['语文',4,'预测','预测与原文不同，就一定是错的。',['正确','错误'],1,'预测重在有依据、会思考，不要求一定与原文相同。'],['语文',5,'观察','写观察记录时，应该怎样做？',['认真连续观察','随便想象','只看一次'],0,'细致、连续地观察，才能发现事物的变化。'],['语文',5,'句子','“小猫的眼睛像两颗宝石”使用了什么修辞？',['比喻','排比','反问'],0,'把眼睛比作宝石，是比喻句。'],['语文',6,'古诗','“两岸青山相对出”的下一句是？',['孤帆一片日边来','淡妆浓抹总相宜','潭面无风镜未磨'],0,'诗句出自李白《望天门山》。'],['语文',6,'古诗','“欲把西湖比西子”中的“西子”指谁？',['西施','王昭君','貂蝉'],0,'西子即西施，诗人用她比喻美丽的西湖。'],['语文',7,'标点','提示语在前面时，提示语后通常用冒号。',['正确','错误'],0,'如：妈妈说：“快来吃饭。”'],['语文',7,'理解','理解难懂的词语，可以联系上下文。',['正确','错误'],0,'结合前后句能帮助判断词语在文中的意思。'],['语文',8,'人物品质','司马光砸缸表现了他怎样的品质？',['机智勇敢','骄傲自满','胆小怕事'],0,'遇到紧急情况，他沉着想办法救人。'],['语文',8,'字词','“诚实”的反义词是？',['虚假','认真','善良'],0,'诚实是不说假话，反义词是虚假。'],

['英语',1,'问候','早上见到老师，应说：',['Good morning.','Good night.','Goodbye.'],0,'Good morning. 表示“早上好”。'],['英语',1,'问候','告别时可以说 Goodbye.',['正确','错误'],0,'Goodbye. 是常用的告别语。'],['英语',2,'自我介绍','“我是玲玲。”英文是：',['I am Lingling.','You are Lingling.','Hello, Daming.'],0,'I am... 用来介绍自己。'],['英语',2,'姓名','询问对方姓名，应说：',['What is your name?','How old are you?','How are you?'],0,'What is your name? 意为“你叫什么名字？”'],['英语',3,'课堂指令','Stand up. 的意思是：',['起立','坐下','打开书'],0,'stand up 表示“站起来”。'],['英语',3,'课堂指令','Sit down, please. 的意思是“请坐”。',['正确','错误'],0,'sit down 表示“坐下”。'],['英语',4,'颜色','“黄色”的英文是：',['yellow','green','black'],0,'yellow 意为黄色。'],['英语',4,'颜色','The sky is usually _____.',['blue','red','black'],0,'晴朗的天空通常是蓝色，blue。'],['英语',5,'数字','seven 后面的数是：',['eight','six','ten'],0,'数字顺序是 seven, eight。'],['英语',5,'数字','How many? 是询问什么？',['数量','姓名','颜色'],0,'How many? 意为“多少个？”'],['英语',6,'学校物品','“书桌”的英文是：',['desk','door','chair'],0,'desk 是书桌，chair 是椅子。'],['英语',6,'学校物品','This is my classroom. 意思是“这是我的教室”。',['正确','错误'],0,'classroom 意为教室。'],['英语',7,'年龄','询问年龄，应说：',['How old are you?','What is this?','Where are you?'],0,'How old are you? 意为“你几岁？”'],['英语',7,'年龄','I am nine. 意思是：',['我九岁','我很好','我叫九'],0,'回答年龄可用 I am + 数字。'],['英语',8,'朋友','“这是我的朋友。”英文是：',['This is my friend.','This is my father.','She is a teacher.'],0,'friend 意为朋友。'],['英语',8,'代词','介绍一位男孩可以用 He is...',['正确','错误'],0,'he 指男性“他”。'],['英语',9,'家庭','“母亲”的英文是：',['mother','brother','father'],0,'mother 是母亲。'],['英语',9,'家庭','sister 的意思是：',['姐妹','兄弟','祖父'],0,'sister 表示姐姐或妹妹。'],['英语',10,'身体','用哪一个词表示“头”？',['head','hand','leg'],0,'head 是头，hand 是手，leg 是腿。'],['英语',10,'身体','Point to your nose. 意思是“指向你的鼻子”。',['正确','错误'],0,'point to 是“指向”，nose 是“鼻子”。']];
const key='grade3AdventureV1', today=()=>new Date().toISOString().slice(0,10);let D=Object.assign({stars:0,records:[],mistakes:{},progress:{语文:0,数学:0,英语:0},habits:{wash:{asked:false,confirmed:false,date:''},tidy:{asked:false,confirmed:false,date:''}},badges:{},bossWins:0,sound:true,pin:'1234',settings:{maxMinutes:30,difficulty:'normal',dailyCount:10}},JSON.parse(localStorage.getItem(key)||'{}'));let quiz=null,startAt=0;

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.page));
function render(){document.querySelector('#stars').textContent=D.stars+' ⭐';document.querySelector('#todayTasks').textContent=D.records.filter(r=>r.date===today()).length;document.querySelector('#todayMinutes').textContent=todayMins();document.querySelector('#soundBtn').textContent=D.sound?'🔊 音效':'🔇 静音';document.querySelector('#map').innerHTML=Object.entries(UNITS).map(([s,u])=>`<div class="lane"><h3>${s==='语文'?'📚':s==='数学'?'🧮':'🔤'} ${s}星球</h3><div class="path"><span>🧑‍🚀</span><span class="node ${D.progress[s]>=Math.ceil(u.length/2)?'done':''}">👾</span><span class="node ${D.progress[s]>=u.length?'done':''}">🏰</span></div><div class="bar"><i style="width:${D.progress[s]/u.length*100}%"></i></div><div style="text-align:center">已点亮 ${D.progress[s]} / ${u.length} 个单元</div></div>`).join('');renderHabits();let ready=Object.keys(UNITS).every(s=>D.progress[s]>=UNITS[s].length)&&['wash','tidy'].every(h=>D.habits[h].confirmed&&D.habits[h].date===today());document.querySelector('#bossBtn').disabled=!ready;document.querySelector('#boss').textContent=ready?'🐲':'🔒';document.querySelector('#bossText').textContent=ready?'勇气和知识都集齐啦，挑战吧！':'三科学习全部通关，并完成今天的生活打卡后解锁';let defs=[['first','🌟','初次启航'],['ten','🏃','任务达人'],['accurate','🎯','细心之星'],['habit','🧼','生活小能手'],['boss','👑','星球守护者']];document.querySelector('#badges').innerHTML=defs.map(x=>`<span class="badge ${D.badges[x[0]]?'got':''}" title="${x[2]}">${x[1]}<small>${x[2]}</small></span>`).join('');save()}
function renderHabits(){let names={wash:'个人洗漱',tidy:'物品整理'};document.querySelector('#habits').innerHTML=Object.keys(names).map(h=>{let v=D.habits[h],done=v.confirmed&&v.date===today();return `<div class="habit"><span>${done?'✅':'🌱'} ${names[h]}</span><button data-habit="${h}" ${done||v.asked?'disabled':''}>${done?'家长已确认':v.asked?'等待家长确认':'我完成了'}</button></div>`}).join('');document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>{D.habits[b.dataset.habit]={asked:true,confirmed:false,date:today()};save();render();toast('做得真棒！请家长来确认吧 🌟')})}
const subject=document.querySelector('#subject'),unit=document.querySelector('#unit');subject.innerHTML=Object.keys(UNITS).map(s=>`<option>${s}</option>`).join('');function fillUnits(){unit.innerHTML=UNITS[subject.value].map((u,i)=>`<option value="${i+1}">${u[0]}</option>`).join('');unit.onchange=unitInfo;unitInfo()}function unitInfo(){document.querySelector('#unitInfo').textContent='本单元重点：'+UNITS[subject.value][unit.value-1][1]}subject.onchange=fillUnits;fillUnits();document.querySelector('#count').value=D.settings.dailyCount;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(items,target,title){if(!canStudy())return;if(!items.length){toast('这个范围的题目还在整理中');return}let n=target==='quiz'?+document.querySelector('#count').value:Math.min(10,items.length);let pool=[];while(pool.length<n)pool.push(...shuffle(items));quiz={items:pool.slice(0,n),i:0,right:0,answers:[],target,title};startAt=Date.now();document.querySelector('#'+target).classList.remove('hidden');drawQuestion()}
document.querySelector('#startBtn').onclick=()=>start(B.filter(q=>q[0]===subject.value&&q[1]===+unit.value),'quiz',`${subject.value} ${UNITS[subject.value][unit.value-1][0]}`);
function drawQuestion(){let box=document.querySelector('#'+quiz.target),q=quiz.items[quiz.i];box.innerHTML=`<div class="sub">${esc(quiz.title)} · 第 ${quiz.i+1}/${quiz.items.length} 题</div><div class="bar"><i style="width:${quiz.i/quiz.items.length*100}%"></i></div><div class="question">${esc(q[3])}</div>${q[4].map((o,i)=>`<button class="option" data-a="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<div id="fb"></div>`;box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(+b.dataset.a))}
function answer(a){let q=quiz.items[quiz.i],ok=a===q[5];quiz.answers.push({q:q[3],a:q[4][a],correct:q[4][q[5]],ok,k:q[2],ex:q[6]});if(ok)quiz.right++;else D.mistakes[q[0]+'|'+q[2]]=(D.mistakes[q[0]+'|'+q[2]]||0)+1;beep(ok);document.querySelectorAll('[data-a]').forEach((b,i)=>{b.disabled=true;if(i===q[5])b.classList.add('correct');if(i===a&&!ok)b.classList.add('wrong')});document.querySelector('#fb').innerHTML=`<div class="feedback"><b>${ok?'太棒了，答对啦！🌟':'没关系，我们找到一个进步机会！🌱'}</b><br>${esc(q[6])}</div><button id="next" class="primary">${quiz.i+1===quiz.items.length?'查看成绩':'下一题'} ➜</button>`;document.querySelector('#next').onclick=()=>{quiz.i++;quiz.i<quiz.items.length?drawQuestion():finishQuiz()}}
function finishQuiz(){let sec=Math.max(1,Math.round((Date.now()-startAt)/1000)),rate=Math.round(quiz.right/quiz.items.length*100),sub=quiz.items[0][0];D.records.push({date:today(),subject:sub,title:quiz.title,total:quiz.items.length,right:quiz.right,rate,seconds:sec,answers:quiz.answers});D.stars+=quiz.right+3;D.badges.first=true;if(D.records.length>=10)D.badges.ten=true;if(rate>=90)D.badges.accurate=true;if(quiz.target==='quiz'&&rate>=60){let u=quiz.items[0][1];D.progress[sub]=Math.max(D.progress[sub],u)}save();let box=document.querySelector('#'+quiz.target);box.innerHTML=`<div class="monster spark">${rate>=90?'🦄':rate>=60?'🐣':'🌱'}</div><h2 style="text-align:center">${rate>=90?'闪闪发光的成绩！':rate>=60?'任务完成，继续成长！':'认真完成就是很大的进步！'}</h2><div class="stat"><b>${rate}%</b>答对 ${quiz.right} / ${quiz.items.length} 题，获得 ${quiz.right+3} 颗星</div><p style="text-align:center"><button onclick="this.closest('.card').classList.add('hidden');render()">回到学习地图</button></p>`;render()}
function weakStats(){let all={};D.records.forEach(r=>r.answers.forEach(a=>{let k=r.subject+'|'+a.k;all[k]??={n:0,r:0};all[k].n++;if(a.ok)all[k].r++}));return Object.entries(all).map(([k,v])=>({k,n:v.n,rate:Math.round(v.r/v.n*100)})).sort((a,b)=>a.rate-b.rate)}function renderWeak(){let w=weakStats().filter(x=>x.rate<80);document.querySelector('#weakList').innerHTML=w.length?w.slice(0,6).map(x=>`<div class="report-row"><b>${esc(x.k.replace('|',' · '))}</b> 掌握度 ${x.rate}%<div class="bar"><i style="width:${x.rate}%"></i></div></div>`).join(''):'<div class="empty">完成几次练习后，这里会自动找到需要加强的知识点。✨</div>';document.querySelector('#weakBtn').disabled=!w.length}
document.querySelector('#weakBtn').onclick=()=>{let keys=weakStats().filter(x=>x.rate<80).slice(0,3).map(x=>x.k);start(B.filter(q=>keys.includes(q[0]+'|'+q[2])),'weakQuiz','薄弱知识点巩固')};
function renderReport(){let total=D.records.reduce((s,r)=>s+r.total,0),right=D.records.reduce((s,r)=>s+r.right,0),rate=total?Math.round(right/total*100):0;document.querySelector('#reportBody').innerHTML=`<div class="grid"><div class="stat"><b>${rate}%</b>总正确率</div><div class="stat"><b>${mins()}</b>学习分钟</div><div class="stat"><b>${D.records.length}</b>完成任务</div></div><h3>学科表现</h3>${Object.keys(UNITS).map(s=>{let rs=D.records.filter(r=>r.subject===s),t=rs.reduce((a,r)=>a+r.total,0),x=rs.reduce((a,r)=>a+r.right,0),p=t?Math.round(x/t*100):0;return `<div class="report-row">${s} ${p}%<div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}<h3>薄弱知识点</h3>${weakStats().filter(x=>x.rate<80).slice(0,8).map(x=>`<span class="chip">${esc(x.k.replace('|',' · '))} ${x.rate}%</span>`).join(' ')||'暂未发现明显薄弱点，继续保持！'}`;let wrong=D.records.flatMap(r=>r.answers.filter(a=>!a.ok).map(a=>({...a,s:r.subject}))).slice(-20).reverse();document.querySelector('#mistakes').innerHTML=wrong.length?wrong.map(a=>`<details class="feedback"><summary><b>${a.s} · ${esc(a.k)}</b> ${esc(a.q)}</summary><p>你的答案：${esc(a.a)}<br>正确答案：${esc(a.correct)}<br>${esc(a.ex)}</p></details>`).join(''):'<div class="empty">错题本还是空的，开始一次练习吧！</div>'}
document.querySelector('#soundBtn').onclick=()=>{D.sound=!D.sound;save();render();beep()};document.querySelector('#bossBtn').onclick=()=>{D.bossWins++;D.stars+=30;D.badges.boss=true;Object.keys(D.progress).forEach(s=>D.progress[s]=0);Object.keys(D.habits).forEach(h=>D.habits[h]={asked:false,confirmed:false,date:''});save();render();toast('成功守护星球！获得30颗星，新的旅程开始啦！👑')};
document.querySelector('#unlockBtn').onclick=()=>{if(document.querySelector('#pinInput').value===D.pin){document.querySelector('#parentLock').classList.add('hidden');document.querySelector('#parentPanel').classList.remove('hidden');renderParent()}else toast('口令不对，请请家长再试一次')};function renderParent(){document.querySelector('#maxMinutes').value=D.settings.maxMinutes;document.querySelector('#difficulty').value=D.settings.difficulty;document.querySelector('#dailyCount').value=D.settings.dailyCount;let names={wash:'个人洗漱',tidy:'物品整理'};document.querySelector('#parentHabits').innerHTML=Object.keys(names).map(h=>{let v=D.habits[h];return `<div class="habit"><span>${names[h]}：${v.asked&&v.date===today()?'孩子已申请':'尚未申请'}</span><button data-confirm="${h}" ${!v.asked||v.date!==today()||v.confirmed?'disabled':''}>${v.confirmed&&v.date===today()?'已确认':'家长确认'}</button></div>`}).join('');document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>{D.habits[b.dataset.confirm].confirmed=true;D.badges.habit=true;D.stars+=2;save();renderParent();render();toast('确认成功，生活能量 +2 ⭐')})}
document.querySelector('#saveSettings').onclick=()=>{D.settings={maxMinutes:Math.max(5,+document.querySelector('#maxMinutes').value||30),difficulty:document.querySelector('#difficulty').value,dailyCount:Math.max(3,Math.min(30,+document.querySelector('#dailyCount').value||10))};document.querySelector('#count').value=[5,10,15,20].reduce((a,b)=>Math.abs(b-D.settings.dailyCount)<Math.abs(a-D.settings.dailyCount)?b:a);save();toast('今日安排保存好啦')};document.querySelector('#exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='星球学习备份-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#importBtn').onclick=()=>document.querySelector('#fileInput').click();document.querySelector('#fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{D=Object.assign(D,JSON.parse(r.result));save();render();renderParent();toast('备份导入成功')}catch(x){toast('这个备份文件无法读取')}};r.readAsText(f)};document.querySelector('#pinBtn').onclick=()=>{let p=prompt('请输入新的家长口令（4—8位）：');if(/^.{4,8}$/.test(p||'')){D.pin=p;save();toast('家长口令已更新')}else if(p!==null)toast('请输入4—8位口令')};document.querySelector('#resetBtn').onclick=()=>{if(confirm('确定重置全部学习记录和闯关进度吗？此操作无法撤销。')){localStorage.removeItem(key);location.reload()}};
render();
</script>
