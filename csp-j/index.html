  const rows=preview.filter(q=>[q.stem,q.id,q.type,'GESP '+q.level+'级'].some(s=>s.toLowerCase().includes(query)));
  document.querySelector('#reviewResults').innerHTML='<p>'+rows.length+' 组匹配</p>'+rows.map(q=>
    '<details><summary>'+escapeText(q.id)+' · '+escapeText(q.stem)+'</summary><p>'+escapeText(q.type)+
    ' · 同组另有 '+q.variants+' 条候选</p><ol type="A">'+q.options.map(o=>'<li>'+escapeText(o)+'</li>').join('')+
    '</ol><p>原题库答案（待复核） '+escapeText(q.options[q.answer])+'</p></details>').join('');
}
document.addEventListener('input',e=>{if(e.target.id==='reviewSearch')renderReviewResults()});

function audit(items, bank, topics) {
  const norm = s => s.normalize('NFKC').toLowerCase().replace(/[\s。？？，、；：,?!;:]/gu,'');
  const key = q => JSON.stringify([q.type,norm(q.stem),q.code_block?.trim() ?? '']);
  const found = new Map(bank.map(q => [key(q), q]));
  const ids = new Set(bank.map(q => q.id));
  const known = new Set(topics.map(t => t.id));
  const accepted = [], rejected = [];
  for (const q of items) {
    const errors = [];
    try {
      if (!q || !/^[A-Za-z0-9_-]{1,80}$/.test(q.id) ||
          !Array.isArray(q.kp_ids) || !q.kp_ids.length || q.kp_ids.some(k=>!known.has(k)) ||
          !Number.isInteger(q.difficulty) || q.difficulty<1 || q.difficulty>5 ||
          !/^T(?:[1-9]|10)$/.test(q.family) || typeof q.stem!=='string' || !q.stem.trim() ||
          typeof q.explain!=='string' || !q.explain.trim()) throw Error('题目字段不完整');
      const n = {single_choice:4,judge:2}[q.type];
      if (!n || !Array.isArray(q.options) || q.options.length!==n ||
          q.options.some((o,i)=>o?.key!=='ABCD'[i] || typeof o.text!=='string' || !norm(o.text)) ||
          new Set(q.options.map(o=>norm(o.text))).size!==n ||
          !q.options.some(o=>o.key===q.answer)) throw Error('选项或答案键无效');
      const previous = found.get(key(q));
      if (previous) {
        const answer = item => norm(item.options.find(o=>o.key===item.answer).text);
        errors.push(answer(q)===answer(previous)?'题干重复':'相同题干的答案冲突');
      }
      if (ids.has(q.id)) errors.push('题号重复');
      if (!q.source || !['generated','real_exam','open_repo','public_oj'].includes(q.source.kind) ||
          !q.source.name?.trim() || !q.source.license?.trim() || /^unknown$/i.test(q.source.license.trim()) ||
          !/^\d{4}-\d{2}-\d{2}$/.test(q.source.collected_at) ||
          !['https:','http:'].includes(new URL(q.source.url).protocol)) errors.push('题源或授权信息缺失');
      if(q.source?.kind==='real_exam' && (!Number.isInteger(q.year) || q.year<2005 || q.year>2026))errors.push('真题年份缺失');
      if (q.status!=='active' || q.code_block || q.verify?.method!=='solver') errors.push('需人工复核或编译验证');
      const v=q.verify;
      const a=v?.args;
      if(!Array.isArray(a) || a.length!==2 || !a.every(x=>Number.isSafeInteger(x)&&Math.abs(x)<=1000000)) throw Error('缺少可执行的求解参数');
      const [x,y]=a;
      const solvers = {
        gcd(){let m=Math.abs(x),n=Math.abs(y);while(n)[m,n]=[n,m%n];return m},
        remainder:()=>y===0?undefined:x%y,
        combinations:()=>y===2 && x>=2?x*(x-1)/2:undefined,
        xor:()=>x^y,
        binary:()=>/^[01]{1,7}$/.test(String(x)) && y===2?parseInt(x,2):undefined,
        prime:()=>{if(x<2)return false;for(let d=2;d*d<=x;d++)if(x%d===0)return false;return true},
        arithmeticSum:()=>x>=1&&y>=1?x*y*(y+1)/2:undefined,
        prefixRange:()=>x>=1&&x<=y?y*(y+1)/2-x*(x-1)/2:undefined,
        permutations:()=>x>=y&&y>=0&&y<=5?Array.from({length:y},(_,i)=>x-i).reduce((p,v)=>p*v,1):undefined,
        pairCount:()=>x>=1&&y>=1?x*y:undefined,
        repeatedHalving:()=>x>0&&y===2?Math.floor(Math.log2(x))+1:undefined,
        modularPower:()=>x>=0&&x<=20&&y>=0&&y<=10?Number(BigInt(x)**BigInt(y)%7n):undefined,
        stackTop:()=>[x,y].slice(0,-1).at(-1),
        queueFront:()=>[x,y].slice(1)[0],
        maxAdjacent:()=>Math.max(x,y),
        lcm:()=>x>0&&y>0?x*y/solvers.gcd():undefined
      };
      const result=Object.hasOwn(solvers,v.op)?solvers[v.op]():undefined;
      const answer=q.options.find(o=>o.key===q.answer).text.trim();
      const expected=q.type==='judge'
        ? (typeof result==='boolean' && typeof v.claim==='boolean' ? (result===v.claim?'正确':'错误') : null)
        : (Number.isSafeInteger(result)?String(result):null);
      if(expected===null || expected!==answer)errors.push('答案与求解结果不一致或缺少支持的求解器');
    } catch(e) {errors.push(e instanceof TypeError?'字段格式无效':e.message)}
    if(errors.length)rejected.push({id:String(q?.id??'未知'),errors});
    else {accepted.push(q);found.set(key(q),q);ids.add(q.id)}
  }
  return {accepted,rejected};
}



function escapeText(value){
  return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}
let importSummary='';
function importPage(){
  return '<article><h2>导入本地题库</h2><p>选择 JSON 文件。系统核验题号、题干、选项、来源字段及求解结果。代码题和缺少求解参数的题目列入待复核。</p><label>选择 JSON 文件<input id="importFile" type="file" accept=".json,application/json"></label><p>本浏览器已保存 '+local.length+' 道导入题。导入数据仅保存在本浏览器。</p><div role="status">'+importSummary+'</div></article>';
}
async function importFile(file){
  if(!file)return;
  try{
    if(file.size>5000000)throw Error('JSON 文件应小于 5 MB');
    const data=JSON.parse((await file.text()).replace(/^\uFEFF/u,''));
    const items=Array.isArray(data)?data:data?.items;
    if(!Array.isArray(items))throw Error('请提供题目数组或含 items 数组的对象');
    const report=audit(items,questions,topics);
    if(report.accepted.length){
      const next={...state,imported:[...local,...report.accepted]};
      localStorage.setItem(storageKey,JSON.stringify(next));
      state=next;
      local.push(...report.accepted);
      questions.push(...report.accepted);
    }
    importSummary='<p>成功导入 '+report.accepted.length+' 道，待复核 '+report.rejected.length+' 道。</p>'+
      report.rejected.map(r=>'<p class="bad">'+escapeText(r.id)+' · '+escapeText(r.errors.join('；'))+'</p>').join('');
  }catch(e){importSummary='<p class="bad">导入失败 · '+escapeText(e.message)+'</p>'}
  if(page==='题库导入')render();
}

const $ = s => document.querySelector(s);
const topics = JSON.parse($('#topics').textContent);
const builtIn = JSON.parse($('#questions').textContent);
const names = Object.fromEntries(topics.map(t=>[t.id,t.name]));
const day = 86400000;
const storageKey = 'csp-j-first-round-v1';
const defaults = {attempts:[],wrong:{},reports:{}};
let state;
try { state = JSON.parse(localStorage.getItem(storageKey)) ?? defaults }
catch { state = defaults }
function save(){
  try {localStorage.setItem(storageKey,JSON.stringify(state))}
  catch { alert('浏览器无法保存记录，本次会话内仍可继续练习。') }
}
const local = audit(Array.isArray(state.imported)?state.imported:[],builtIn,topics).accepted;
const questions=[...builtIn,...local];
let page = '首页', topic = '', type = '', family = '', difficulty = '', query = '', onlyWrong = false;
let current = null, selected = null;
const pages = ['首页','知识地图','专项练习','错题本','整卷模拟','历年真题','覆盖率','题库导入','待复核题库'];
function rate(records){return records.length ? records.filter(x=>x.ok).length / records.length : null}
function mastery(id){
  const rows = state.attempts.filter(a=>a.topic===id);
  if(!rows.length)return null;
  const recent = rows.slice(-3);
  const mean = rate(recent);
  const age = (Date.now()-recent.at(-1).at)/day;
  return Math.round(100*rate(rows)*Math.exp(-age/30)*(1-mean*(1-mean)));
}
function navigate(next){
  page=next;
  current=null;
  selected=null;
  render();
}
function attempt(q,key){
  const ok = key===q.answer, at=Date.now();
  state.attempts.push({id:q.id,topic:q.kp_ids[0],ok,at});
  const wrong=state.wrong[q.id];
  if(!ok)state.wrong[q.id]={streak:0,due:at+day,miss:(wrong?.miss??0)+1};
  else if(wrong && wrong.due<=at){
    if(wrong.streak===1)delete state.wrong[q.id];
    else {wrong.streak=1;wrong.due=at+2*day}
  }
  save();
}
function pool(){
  return questions.filter(q=>q.source.kind!=='real_exam'&&(!topic||q.kp_ids.includes(topic))&&(!type||q.type===type)&&(!family||q.family===family)&&(!difficulty||q.difficulty===Number(difficulty))&&(!query||q.stem.includes(query))&&(!onlyWrong||state.wrong[q.id]));
}
function button(label,action,cls=''){return '<button class="'+cls+'" data-action="'+action+'">'+label+'</button>'}
function select(id,label,options,value){
  return '<label>'+label+'<select id="'+id+'">'+options.map(([k,v])=>'<option value="'+k+'"'+(k===value?' selected':'')+'>'+v+'</option>').join('')+'</select></label>';
}
function question(){
  const q=current;
  if(!q)return '';
  const done=selected!==null;
  return '<article><small>'+names[q.kp_ids[0]]+' · 难度 '+q.difficulty+' · '+q.id+'</small><h2>'+escapeText(q.stem)+'</h2>'+
    q.options.map(o=>'<button class="option '+(done?(o.key===q.answer?'good':o.key===selected?'bad':''):'')+'" data-action="answer:'+o.key+'" '+(done?'disabled':'')+'>'+o.key+'　'+escapeText(o.text)+'</button>').join('')+
    (done?'<p role="status" class="'+(selected===q.answer?'good':'bad')+'">'+(selected===q.answer?'答对了':'正确答案 '+q.answer)+'</p><p>'+escapeText(q.explain)+'</p>':'')+
    '<details><summary>题源与校验证据</summary><p>'+(q.source.kind==='generated'?'AI 生成 · ':'')+'已运行求解器 · '+escapeText(q.source.license)+' · '+escapeText(q.source.collected_at)+'</p><p><a href="'+escapeText(q.source.url)+'">题目来源</a></p><pre>'+escapeText(q.verify.evidence??JSON.stringify({op:q.verify.op,args:q.verify.args,claim:q.verify.claim}))+'</pre></details>'+
    button(state.reports[q.id]?'已记录问题':'这题有问题','report')+'</article>';
}
function render(){
  $('nav').innerHTML=pages.map(p=>'<button data-action="page:'+p+'" '+(page===p?'aria-current="true"':'')+'>'+p+'</button>').join('');
  const view=$('#view');
  if(page==='首页'){
    const counts=Array.from({length:7},(_,i)=>state.attempts.filter(a=>Math.floor((Date.now()-a.at)/day)===i).length).reverse();
    const preferred=Object.entries(state.wrong).filter(([,w])=>w.due<=Date.now()).sort((a,b)=>b[1].miss-a[1].miss)[0];
    const recent=state.attempts.filter(a=>a.at>=Date.now()-7*day);
    view.innerHTML='<article><h2>今日练习</h2><p>'+questions.length+' 道已校验题 · '+state.attempts.length+' 次作答 · '+Object.keys(state.wrong).length+' 道待巩固错题</p><p>'+(preferred?'有错题到期，先复习错题本。':'可从进制转换、位运算和基础数学开始。')+'</p><div class="row">'+button('开始专项练习','page:专项练习','primary')+button('查看题库缺口','page:覆盖率')+'</div></article><article><h2>学习看板</h2><p>最近七天作答量（从早到近） '+counts.join(' · ')+'</p><p>最近七天正确率 '+(recent.length?Math.round(100*rate(recent))+'%':'无作答')+'</p>'+
     [...new Set(topics.map(t=>t.module))].map(m=>{const ids=topics.filter(t=>t.module===m).map(t=>t.id);const r=rate(state.attempts.filter(a=>ids.includes(a.topic)));return '<p>'+m+' · '+(r===null?'未练习':Math.round(r*100)+'%')+'</p>'}).join('')+'</article>';
  }else if(page==='知识地图'){
    view.innerHTML=[...new Set(topics.map(t=>t.module))].map(m=>'<details open><summary>'+m+'</summary><div class="row">'+topics.filter(t=>t.module===m).map(t=>{const v=mastery(t.id);return button(t.name+' · '+(v===null?'未练习':v+'%'),'topic:'+t.id,v===null?'':v>=80?'good':v>=50?'mid':'bad')}).join('')+'</div></details>').join('');
  }else if(page==='专项练习'){
    view.innerHTML='<article><h2>专项练习</h2><div class="row">'+select('topic','知识点',[['','全部'],...topics.map(t=>[t.id,t.name])],topic)+select('type','题型',[['','全部'],['single_choice','单选'],['judge','判断']],type)+select('family','题型族',[['','全部'],['T2','判断正误'],['T3','数值计算']],family)+select('difficulty','难度',[['','全部'],...[1,2,3,4,5].map(n=>[String(n),n])],difficulty)+'<label>题干搜索<input id="search" type="search"></label></div><label style="display:block"><input id="onlyWrong" type="checkbox" '+(onlyWrong?'checked':'')+'> 只练错题</label><div class="row">'+button(current?'换一道':'抽一道','draw','primary')+'<span>'+pool().length+' 道符合条件</span></div></article>'+question();
    $('#search').value=query;
  }else if(page==='错题本'){
    const wrong=questions.filter(q=>state.wrong[q.id]);
    view.innerHTML='<article><h2>错题本</h2><p>到期后作答。连续两次到期答对后移出。</p>'+(!wrong.length?'<p>目前没有错题。</p>':'')+
      wrong.map(q=>{const w=state.wrong[q.id];return '<p>'+names[q.kp_ids[0]]+' · '+q.id+' · 错 '+w.miss+' 次 · 连对 '+w.streak+' 次 · '+(w.due<=Date.now()?button('复习','review:'+q.id):new Date(w.due).toLocaleString('zh-CN'))+'</p>'}).join('')+'</article>'+question();
  }else if(page==='覆盖率'){
    view.innerHTML='<article><h2>题库覆盖率</h2><p>按主考点统计。大纲编号、等级及历年频率待逐项核对。</p>'+button('导出覆盖率 CSV','csv')+'<div class="scroll"><table><thead><tr>'+header.map(h=>'<th scope="col">'+h+'</th>').join('')+'</tr></thead><tbody>'+coverage().map(row=>'<tr>'+row.map((v,i)=>'<td '+(i===row.length-1?'class="bad"':'')+'>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></article>';
  }else if(page==='待复核题库'){
    view.innerHTML=reviewPage();renderReviewResults();
  }else if(page==='题库导入'){
    view.innerHTML=importPage();
  }else if(page==='整卷模拟'){
    view.innerHTML='<article><h2>整卷模拟</h2><p>完整卷待入库。当前练习题可在专项中使用。</p>'+button('前往专项','page:专项练习')+'</article>';
  }else{
    view.innerHTML='<article><h2>历年真题</h2><p>2019—2026 年逐题核验与映射待完成。</p><p><a href="https://www.noi.cn/zxzy/index.shtml">CCF NOI 历年资料入口</a></p><p><a href="https://csppass.com/">2019—2026 第一轮在线练习索引</a></p></article>'+questions.filter(q=>q.source.kind==='real_exam').map(q=>'<p>'+q.year+' · '+names[q.kp_ids[0]]+' '+button('练习真题','review:'+q.id)+'</p>').join('')+question();
  }
}
const header=['知识点','选择','判断','真题','难度1–2','难度3','难度4–5','题型族','校验通过率','去重净值','状态'];
function coverage(){return topics.map(t=>{
  const qs=questions.filter(q=>q.kp_ids[0]===t.id);
  const n=qs.filter(q=>q.type==='single_choice').length;
  return [t.name,n,qs.length-n,qs.filter(q=>q.source.kind==='real_exam').length,qs.filter(q=>q.difficulty<=2).length,qs.filter(q=>q.difficulty===3).length,qs.filter(q=>q.difficulty>=4).length,new Set(qs.map(q=>q.family)).size,qs.length?'100%':'—',qs.length,'缺选择 '+(100-n)+' / 判断 '+(100-qs.length+n)];
})}
function download(){
  const encode=v=>'"'+String(v).replaceAll('"','""')+'"';
  const csv=[header,...coverage()].map(row=>row.map(encode).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='csp-j-coverage.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='importFile'){await importFile(el.files[0]);return}
  if(el.id==='topic')topic=el.value;
  else if(el.id==='type')type=el.value;
  else if(el.id==='family')family=el.value;
  else if(el.id==='difficulty')difficulty=el.value;
  else if(el.id==='search')query=el.value.trim();
  else if(el.id==='onlyWrong')onlyWrong=el.checked;
  else return;
  current=null;selected=null;render();$('#'+el.id)?.focus();
});
document.addEventListener('click',e=>{
  const action=e.target.closest('[data-action]')?.dataset.action;
  if(!action)return;
  const [kind,value]=action.split(':');
  if(kind==='page')navigate(value);
  if(kind==='topic'){topic=value;type=family=difficulty=query='';onlyWrong=false;navigate('专项练习')}
  if(kind==='draw'){
    const available=pool(),other=available.filter(q=>q!==current);
    const candidates=other.length?other:available;
    current=candidates[Math.floor(Math.random()*candidates.length)]??null;
    selected=null;render();$('.option')?.focus();
  }
  if(kind==='review'){current=questions.find(q=>q.id===value);selected=null;render();$('.option')?.focus()}
  if(kind==='answer'&&current&&selected===null){selected=value;attempt(current,value);render()}
  if(kind==='report'&&current){state.reports[current.id]=Date.now();save();render()}
  if(kind==='csv')download();
});
render();
</script></html>
